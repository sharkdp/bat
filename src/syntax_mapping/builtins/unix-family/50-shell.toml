[mappings]
"Bourne Again Shell (bash)" = [
    # used by lots of shells
    "{,/opt,/usr}/etc/profile",
    ".profile",

    "bashrc",
    "*.bashrc",
    "bash_profile",
    "*.bash_profile",
    "bash_login",
    "*.bash_login",
    "bash_logout",
    "*.bash_logout",

    # Bash completions
    # https://github.com/scop/bash-completion/
    "**/bash-completion/bash_completion",
    "**/bash-completion/completions/*",

    "zshrc",
    "*.zshrc",
    "zprofile",
    "*.zprofile",
    "zlogin",
    "*.zlogin",
    "zlogout",
    "*.zlogout",
    "zshenv",
    "*.zshenv",
]
